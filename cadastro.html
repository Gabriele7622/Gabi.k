<!DOCTYPE html>
<html lang="PT-BR">
<head>
  <style>
    body {
      display: flex;
      justify-content: flex-end; /* empurra o formulário para o lado direito */
      align-items: center;
      height: 100vh;
      margin: 0;
      background-image: url("https://i.pinimg.com/736x/c2/45/74/c24574e5c3b4ff87558b056d3c609345.jpg");
      background-repeat: no-repeat;
      background-size: contain;
      background-position: left center; 
      background-color: #FDFBD4; 
    }

    fieldset {
      border: 1px solid pink;
      background: #FDFBD4;
      width: 250px;
      margin-right: 100px; 
      padding: 15px;
      border-radius: 10px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
    }

    legend {
      color: black;
      font-weight: bold;
    }

    .texto {
      color: black;
      font-size: 14px;
    }

    .campo {
      border: 1px solid pink;
      width: 100%;
      margin-bottom: 8px;
    }

    .botao {
      background-color: blue;
      color: white;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <form id="formulario">
    <fieldset>
      <legend>CADASTRO DE USUÁRIOS</legend>
      <p class="texto">NOME COMPLETO:</p> <input type="text" class="campo">
      <p class="texto">CEP:</p> <input type="text" class="campo">
      <p class="texto">CPF:</p> <input type="text" class="campo">
      <p class="texto">DATA DE NASCIMENTO:</p> <input type="text" class="campo">
      <p class="texto">EMAIL:</p> <input type="text" class="campo">
      <p class="texto">FOTO:</p> <input type="text" class="campo">
      <p class="texto">IDADE:</p> <input type="text" class="campo">
      <p class="texto">RG:</p> <input type="text" class="campo">
      <p class="texto">SENHA:</p> <input type="text" class="campo">
      <p class="texto">TELEFONE:</p> <input type="text" class="campo">
      <input type="submit" value="Cadastrar" class="botao">
    </fieldset>
  </form>
</body>
</html>
